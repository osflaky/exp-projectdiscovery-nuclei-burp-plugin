name: Build

on:
  workflow_dispatch:

# A superseded run tells us nothing, so drop it and keep the latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: ${{ matrix.distribution || 'temurin' }}
        architecture: ${{ matrix.arch }}
        cache: maven

      # verify, not test: the release builds the shaded jar, so package it here too.
    - run: mvn --batch-mode verify
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
